name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tauri security baseline
        run: npm run security:tauri:check

      - name: Core tests
        run: npm run test:core

      - name: Full test suite with coverage gate
        run: npm run test:coverage:core

      - name: Build
        run: npm run build

  browser-smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Browser smoke flow
        run: npm run test:e2e:smoke

  tauri-check:
    name: Tauri Cargo Check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  tauri-desktop-smoke:
    name: Tauri Desktop Smoke
    runs-on: macos-latest
    needs:
      - frontend
      - tauri-check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run desktop smoke
        env:
          TOOLSBOX_TAURI_ARTIFACT_DIR: output/tauri-smoke
        run: npm run test:e2e:tauri

      - name: Upload desktop smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-smoke
          path: output/tauri-smoke
          if-no-files-found: ignore
